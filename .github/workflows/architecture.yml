name: Architecture guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  no-new-production-javascript:
    name: No new production JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
      - name: Test architecture guard
        run: python3 -m unittest discover -s tests -p 'test_no_new_prod_js.py' -v
      - name: Reject new or growing handwritten JavaScript
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 tools/ci/check_no_new_prod_js.py --base "$BASE_SHA" --head "$HEAD_SHA"
