name: DB-05 Save schema contract
on:
  push:
    branches: [main]
    paths:
      - 'data/ddv/save/**'
      - 'src/lib/save/**'
      - 'crates/ddv-save-schema/**'
      - 'tools/db-05-save/**'
      - 'tests/save-schema.test.mjs'
      - 'tests/save-db00-join.test.mjs'
      - 'tests/save-common-shape.test.mjs'
      - 'tests/save-native-shape.test.mjs'
      - 'tests/save-nested-shape.test.mjs'
      - 'tests/save-unified-shape.test.mjs'
      - 'tests/save-domain-shape.test.mjs'
      - 'tests/save-references.test.mjs'
      - 'tests/save-catalog-links.test.mjs'
      - 'tests/save-guide-links.test.mjs'
      - 'tests/save-achievement-links.test.mjs'
      - 'tests/save-duty-progress-evidence.test.mjs'
      - 'tests/save-duty-milestones.test.mjs'
      - 'tests/save-achievement-progress.test.mjs'
      - 'tests/save-diagnostic-view.test.mjs'
      - 'tests/save-p1g-worker-diagnostics.test.mjs'
      - 'src/routes/save/diagnostics/**'
      - 'tests/save-redacted-witness.test.mjs'
      - 'tests/save-redacted-cli.test.mjs'
      - '.github/workflows/db05-save.yml'
  pull_request:
    paths:
      - 'data/ddv/save/**'
      - 'src/lib/save/**'
      - 'crates/ddv-save-schema/**'
      - 'tools/db-05-save/**'
      - 'tests/save-schema.test.mjs'
      - 'tests/save-db00-join.test.mjs'
      - 'tests/save-common-shape.test.mjs'
      - 'tests/save-native-shape.test.mjs'
      - 'tests/save-nested-shape.test.mjs'
      - 'tests/save-unified-shape.test.mjs'
      - 'tests/save-domain-shape.test.mjs'
      - 'tests/save-references.test.mjs'
      - 'tests/save-catalog-links.test.mjs'
      - 'tests/save-guide-links.test.mjs'
      - 'tests/save-achievement-links.test.mjs'
      - 'tests/save-duty-progress-evidence.test.mjs'
      - 'tests/save-duty-milestones.test.mjs'
      - 'tests/save-achievement-progress.test.mjs'
      - 'tests/save-diagnostic-view.test.mjs'
      - 'tests/save-p1g-worker-diagnostics.test.mjs'
      - 'src/routes/save/diagnostics/**'
      - 'tests/save-redacted-witness.test.mjs'
      - 'tests/save-redacted-cli.test.mjs'
      - '.github/workflows/db05-save.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject committed private save and scanner report files
        run: |
          if git ls-files data/ddv/save tools/db-05-save | grep -Ei '([.]profile$|/profile[.]json$|/decoded-save[.]json$|/save-structure[.]json$|/db05-private-summary[.]json$)'; then
            echo 'Private save or report must never be committed'
            exit 1
          fi
      - name: JavaScript and Collection bridge
        run: node --test tests/save-common-shape.test.mjs tests/save-native-shape.test.mjs tests/save-nested-shape.test.mjs tests/save-unified-shape.test.mjs tests/save-domain-shape.test.mjs tests/save-references.test.mjs tests/save-catalog-links.test.mjs tests/save-guide-links.test.mjs tests/save-achievement-links.test.mjs tests/save-duty-progress-evidence.test.mjs tests/save-duty-milestones.test.mjs tests/save-achievement-progress.test.mjs tests/save-diagnostic-view.test.mjs tests/save-p1g-worker-diagnostics.test.mjs tests/save-schema.test.mjs tests/save-db00-join.test.mjs tests/save-redacted-witness.test.mjs tests/save-redacted-cli.test.mjs
      - name: Private report importer (synthetic only)
        run: python3 -m unittest discover -s tools/db-05-save -p 'test_*.py' -v
      - name: Rust borrowed-document schema contract
        run: cargo test --manifest-path crates/ddv-save-schema/Cargo.toml
      - name: Cross-language Rust/JS save reference parity (synthetic only)
        run: node tools/db-05-save/compare_js_rust.mjs
      - name: Cross-language Rust/JS 440-field shape parity (synthetic only)
        run: node tools/db-05-save/compare_unified_shape.mjs
      - name: Rust WASM read-only reference graph target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path crates/ddv-save-schema/Cargo.toml --target wasm32-unknown-unknown --features wasm --release
          test -s crates/ddv-save-schema/target/wasm32-unknown-unknown/release/ddv_save_schema.wasm
