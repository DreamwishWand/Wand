name: DB-05 Save schema contract
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  readonly-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject committed private save and scanner report files
        run: |
          if git ls-files data/ddv/save tools/db-05-save | grep -Ei '([.]profile$|/profile[.]json$|/decoded-save[.]json$|/save-structure[.]json$|/db05-private-summary[.]json$)'; then
            echo 'Private save or report must never be committed'
            exit 1
          fi
      - name: JavaScript and Collection bridge
        run: node --test tests/save-common-shape.test.mjs tests/save-native-shape.test.mjs tests/save-nested-shape.test.mjs tests/save-unified-shape.test.mjs tests/save-domain-shape.test.mjs tests/save-references.test.mjs tests/save-catalog-links.test.mjs tests/save-guide-links.test.mjs tests/save-achievement-links.test.mjs tests/save-duty-progress-evidence.test.mjs tests/save-duty-milestones.test.mjs tests/save-clean-baseline.test.mjs tests/save-clean-regression.test.mjs tests/save-clean-regression-cli.test.mjs tests/save-native-catalog-crosscheck-cli.test.mjs tests/save-db04-grid-path-cli.test.mjs tests/save-db04-observed-grid-completion-cli.test.mjs tests/save-editor-readset.test.mjs tests/save-editor-handoff.test.mjs tests/save-achievement-progress.test.mjs tests/save-diagnostic-view.test.mjs tests/save-p1g-worker-diagnostics.test.mjs tests/save-schema.test.mjs tests/save-db00-join.test.mjs tests/save-redacted-witness.test.mjs tests/save-redacted-cli.test.mjs
      - name: DB-01 TypeScript private DutyAch reward source join (synthetic only)
        run: node --experimental-strip-types --test tests/save-duty-reward-db01.test.mjs
      - name: Private report importer (synthetic only)
        run: python3 -m unittest discover -s tools/db-05-save -p 'test_*.py' -v
      - name: Rust borrowed-document schema contract
        run: cargo test --manifest-path crates/ddv-save-schema/Cargo.toml
      - name: Rust byte-preserving inventory and chest draft (synthetic only)
        run: cargo test --manifest-path crates/ddv-save-patch/Cargo.toml
      - name: Rust native P1G packaged-profile synthetic roundtrip (no export)
        run: cargo test --manifest-path crates/ddv-p1g-codec/Cargo.toml --features native-p1g-lab
      - name: Cross-language Rust/JS save reference parity (synthetic only)
        run: node tools/db-05-save/compare_js_rust.mjs
      - name: Cross-language Rust/JS 440-field shape parity (synthetic only)
        run: node tools/db-05-save/compare_unified_shape.mjs
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Install WASM compilation target
        run: rustup target add wasm32-unknown-unknown
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/ddv-save-schema
          output: src/lib/save/wasm/pkg
          features: wasm
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/ddv-p1g-codec
          output: src/lib/save/wasm/p1g-pkg
          features: wasm
      - name: Rust DB-03 MissionSlot source-ID audit (synthetic)
        run: cargo test --manifest-path crates/ddv-p1g-codec/Cargo.toml --features wasm
      - name: Rust/WASM quantity draft target
        run: |
          cargo build --manifest-path crates/ddv-save-patch/Cargo.toml --target wasm32-unknown-unknown --features wasm --release
          test -s crates/ddv-save-patch/target/wasm32-unknown-unknown/release/ddv_save_patch.wasm
