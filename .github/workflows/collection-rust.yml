name: Collection Rust/WASM migration
on:
  push:
    branches: [feat/collection-rust-wasm-migration]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --manifest-path crates/wand-collection-core/Cargo.toml
      - run: cargo check --manifest-path crates/wand-collection-core/Cargo.toml --target wasm32-unknown-unknown
      - run: wasm-pack build crates/wand-collection-core --release --target web --out-dir ../../src/lib/collection/wasm/pkg
      - run: npm install --no-audit --no-fund
      - run: python3 scripts/build-collection-images.py
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /Wand
      - run: npx playwright install --with-deps chromium
      - run: node browser/collection-smoke.mjs
