name: SRC-02 Acquisition
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  extraction-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tools/src-02-acquisition -p 'test_*.py' -v
      - run: cargo test --manifest-path crates/wand-acquisition-core/Cargo.toml
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/wand-acquisition-core
          output: src/lib/acquisition/wasm/pkg
          features: wasm
      - run: node tools/db-01-items/materialize-public-master.mjs
      - run: node --test tests/acquisition*.test.mjs
