name: Collection checks
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wand-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
      collection: ${{ steps.scope.outputs.collection }}
      memory: ${{ steps.scope.outputs.memory }}
      explore: ${{ steps.scope.outputs.explore }}
      guide: ${{ steps.scope.outputs.guide }}
      save: ${{ steps.scope.outputs.save }}
      world: ${{ steps.scope.outputs.world }}
      pages: ${{ steps.scope.outputs.pages }}
      db01: ${{ steps.scope.outputs.db01 }}
      db03: ${{ steps.scope.outputs.db03 }}
      db04: ${{ steps.scope.outputs.db04 }}
      db05: ${{ steps.scope.outputs.db05 }}
      acquisition: ${{ steps.scope.outputs.acquisition }}
      r2: ${{ steps.scope.outputs.r2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope selection
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Select required product checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then args+=(--full); fi
          if [ "$EVENT_NAME" = merge_group ]; then args+=(--merge-group); fi
          python3 tools/ci/select_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" "${args[@]}"
  product:
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-downloads-${{ runner.os }}-
      - run: wasm-pack build crates/wand-collection-core --release --target web --out-dir ../../src/lib/collection/wasm/pkg
      - run: wasm-pack build crates/ddv-save-schema --release --target web --out-dir ../../src/lib/save/wasm/pkg --features wasm
      - run: wasm-pack build crates/ddv-p1g-codec --release --target web --out-dir ../../src/lib/save/wasm/p1g-pkg --features wasm
      - run: wasm-pack build crates/wand-acquisition-core --release --target web --out-dir ../../src/lib/acquisition/wasm/pkg --features wasm
      - run: wasm-pack build crates/wand-world-core --release --target web --out-dir ../../src/lib/world/wasm/pkg
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --experimental-strip-types --test tests/collection-db01-core.check.mjs
        if: needs.scope.outputs.collection == 'true'
      - run: npm run check
      - name: Prepare publication assets when deployment code changed
        if: needs.scope.outputs.pages == 'true'
        run: python3 scripts/build-collection-images.py
      - run: npm run build
        id: build
        env:
          BASE_PATH: /Wand
      - name: Verify changed publication contract using built artifact
        if: needs.scope.outputs.pages == 'true'
        run: python3 tools/ci/pages_receipt.py --build build --commit "$GITHUB_SHA"
      - run: npx playwright install --with-deps chromium
        id: chromium
      - run: node --experimental-strip-types browser/memory-puzzle-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.memory == 'true' }}
      - run: node browser/collection-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.collection == 'true' }}
      - run: node browser/explore-viewport-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.explore == 'true' }}
      - run: node browser/guide-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.guide == 'true' }}
      - run: node browser/save-wasm-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.save == 'true' }}
      - run: node browser/world-graph-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && needs.scope.outputs.world == 'true' }}
  native:
    needs: scope
    if: needs.scope.outputs.collection == 'true' || ((needs.scope.outputs.save == 'true' || needs.scope.outputs.world == 'true') && needs.scope.outputs.db05 != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - run: python3 -m unittest discover -s tools/collection -p 'test_*.py' -v
        if: needs.scope.outputs.collection == 'true'
      - run: cargo test --manifest-path crates/wand-collection-core/Cargo.toml
        if: needs.scope.outputs.collection == 'true'
      - run: cargo test --manifest-path crates/ddv-save-schema/Cargo.toml
        if: needs.scope.outputs.db05 != 'true'
  db01:
    needs: scope
    if: needs.scope.outputs.db01 == 'true'
    uses: ./.github/workflows/db-01-items.yml
  db03:
    needs: scope
    if: needs.scope.outputs.db03 == 'true'
    uses: ./.github/workflows/db03-guide.yml
  db04:
    needs: scope
    if: needs.scope.outputs.db04 == 'true'
    uses: ./.github/workflows/db04-world.yml
  db05:
    needs: scope
    if: needs.scope.outputs.db05 == 'true'
    uses: ./.github/workflows/db05-save.yml
  acquisition:
    needs: scope
    if: needs.scope.outputs.acquisition == 'true'
    uses: ./.github/workflows/acquisition.yml
  r2:
    needs: scope
    if: needs.scope.outputs.r2 == 'true'
    uses: ./.github/workflows/src04-r2.yml

  collection:
    name: collection
    if: always()
    needs: [scope, product, native, db01, db03, db04, db05, acquisition, r2]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["NEEDS_JSON"])
          if jobs["scope"]["result"] != "success":
              raise SystemExit("CI scope detection failed")
          outputs = jobs["scope"]["outputs"]
          for flag in ("product", "collection", "memory", "explore", "guide", "save", "world", "pages", "db01", "db03", "db04", "db05", "acquisition", "r2"):
              if outputs.get(flag) not in ("true", "false"):
                  raise SystemExit("Missing or invalid CI scope flag: " + flag)
          selected = {key: outputs[key] == "true" for key in ("product", "db01", "db03", "db04", "db05", "acquisition", "r2")}
          selected["native"] = outputs["collection"] == "true" or ((outputs["save"] == "true" or outputs["world"] == "true") and outputs["db05"] != "true")
          for key, required in selected.items():
              expected = "success" if required else "skipped"
              actual = jobs[key]["result"]
              if actual != expected:
                  raise SystemExit(f"{key}: expected {expected}, got {actual}")
              print(f"{key}: {actual}")
          PY
