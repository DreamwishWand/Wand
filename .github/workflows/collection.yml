name: Collection checks
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wand-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope selection
        run: python3 -m unittest discover -s tools/ci -p test_select_checks.py -v
      - name: Select required product checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = workflow_dispatch ]; then args+=(--full); fi
          if [ "$EVENT_NAME" = merge_group ]; then args+=(--merge-group); fi
          python3 tools/ci/select_checks.py --base "$BASE_SHA" --head "$HEAD_SHA" "${args[@]}"
      - name: No product changes
        if: steps.scope.outputs.product == 'false'
        run: echo "No product build required; dedicated source checks remain separate."
      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.product == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        if: steps.scope.outputs.product == 'true'
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.product == 'true'
        with:
          node-version: 22
      - uses: actions/cache@v4
        if: steps.scope.outputs.product == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - uses: actions/cache@v4
        if: steps.scope.outputs.product == 'true'
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-downloads-${{ runner.os }}-
      - run: python3 -m unittest discover -s tools/collection -p 'test_*.py' -v
        if: steps.scope.outputs.product == 'true'
      - run: cargo test --manifest-path crates/wand-collection-core/Cargo.toml
        if: steps.scope.outputs.product == 'true'
      - run: cargo test --manifest-path crates/ddv-save-schema/Cargo.toml
        if: steps.scope.outputs.product == 'true'
      - run: cargo check --manifest-path crates/wand-collection-core/Cargo.toml --target wasm32-unknown-unknown
        if: steps.scope.outputs.product == 'true'
      - run: wasm-pack build crates/wand-collection-core --release --target web --out-dir ../../src/lib/collection/wasm/pkg
        if: steps.scope.outputs.product == 'true'
      - run: wasm-pack build crates/ddv-save-schema --release --target web --out-dir ../../src/lib/save/wasm/pkg --features wasm
        if: steps.scope.outputs.product == 'true'
      - run: wasm-pack build crates/ddv-p1g-codec --release --target web --out-dir ../../src/lib/save/wasm/p1g-pkg --features wasm
        if: steps.scope.outputs.product == 'true'
      - run: wasm-pack build crates/wand-acquisition-core --release --target web --out-dir ../../src/lib/acquisition/wasm/pkg --features wasm
        if: steps.scope.outputs.product == 'true'
      - run: wasm-pack build crates/wand-world-core --release --target web --out-dir ../../src/lib/world/wasm/pkg
        if: steps.scope.outputs.product == 'true'
      - run: npm install --no-audit --no-fund
        if: steps.scope.outputs.product == 'true'
      - run: npm test
        if: steps.scope.outputs.product == 'true'
      - run: node --experimental-strip-types --test tests/collection-db01-core.check.mjs
        if: steps.scope.outputs.product == 'true'
      - run: npm run check
        if: steps.scope.outputs.product == 'true'
      - run: npm run build
        if: steps.scope.outputs.product == 'true'
        id: build
        env:
          BASE_PATH: /Wand
      - run: npx playwright install --with-deps chromium
        if: steps.scope.outputs.product == 'true'
        id: chromium
      - run: node --experimental-strip-types browser/memory-puzzle-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.memory == 'true' }}
      - run: node browser/collection-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.collection == 'true' }}
      - run: node browser/explore-viewport-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.explore == 'true' }}
      - run: node browser/guide-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.guide == 'true' }}
      - run: node browser/save-wasm-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.save == 'true' }}
      - run: node browser/world-graph-smoke.mjs
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.chromium.outcome == 'success' && steps.scope.outputs.world == 'true' }}