name: Collection checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  collection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m unittest discover -s tools/collection -p 'test_*.py' -v
      - run: cargo test --manifest-path crates/wand-collection-core/Cargo.toml
      - run: cargo test --manifest-path crates/ddv-save-schema/Cargo.toml
      - run: cargo check --manifest-path crates/wand-collection-core/Cargo.toml --target wasm32-unknown-unknown
      - run: wasm-pack build crates/wand-collection-core --release --target web --out-dir ../../src/lib/collection/wasm/pkg
      - run: wasm-pack build crates/ddv-save-schema --release --target web --out-dir ../../src/lib/save/wasm/pkg --features wasm
      - run: wasm-pack build crates/ddv-p1g-codec --release --target web --out-dir ../../src/lib/save/wasm/p1g-pkg --features wasm
      - run: wasm-pack build crates/wand-acquisition-core --release --target web --out-dir ../../src/lib/acquisition/wasm/pkg --features wasm
      - run: wasm-pack build crates/wand-world-core --release --target web --out-dir ../../src/lib/world/wasm/pkg
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node --experimental-strip-types --test tests/collection-db01-core.check.mjs
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /Wand
      - run: npx playwright install --with-deps chromium
      - run: node browser/collection-smoke.mjs
      - run: node browser/explore-viewport-smoke.mjs
      - run: node browser/guide-smoke.mjs
      - run: node browser/save-wasm-smoke.mjs
      - run: node browser/world-graph-smoke.mjs