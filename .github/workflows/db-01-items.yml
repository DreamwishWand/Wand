name: DB-01 item database checks

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  item-parser-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test existing SRC-01 and extended wire decoders
        run: python -m unittest discover -s tools/src-01-items -p 'test_*.py' -v
      - name: Test DB-01 normalization and integrity checks
        run: python -m unittest discover -s tools/db-01-items -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test final TypeScript DB-01 API, private indexes and DB-00 bridge
        run: node --experimental-strip-types --test src/lib/items/*.test.mjs
      - name: Parse one-shot private Windows runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tools/db-01-items/run-all.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw 'DB01 PowerShell parser errors'
          }