      - 'tests/world-item-geography.test.mjs'
      - 'tests/world-native-item-scope.test.mjs'
      - 'tests/world-native-realm-universe.test.mjs'
      - 'tests/world-native-tag-taxonomy.test.mjs'
      - 'tests/world-worldless-source-placements.test.mjs'
      - 'tests/world-village-world-tag-overlap.test.mjs'
      - 'tests/world-native-area-tag-overlap.test.mjs'
      - 'tests/world-native-realm-subtree.test.mjs'
      - 'tests/world-native-graph-browser.test.mjs'
