  push:
    branches: [main]
    paths:
      - 'tools/db-04-world/**'
      - 'src/lib/world/**'
      - 'src/routes/world/preview/**'
      - 'tests/world.test.mjs'
      - 'tests/world-local-snapshot.test.mjs'
      - 'tests/world-preview-views.test.mjs'
      - 'tests/world-native-version-gate.test.mjs'
      - 'tests/world-native-anchor-domain.test.mjs'
      - 'tests/world-native-source-anchor-index.test.mjs'
      - 'tests/world-native-item-anchor-finder.test.mjs'
      - 'tests/world-native-gridarea-evidence.test.mjs'
      - 'tests/world-native-gridarea-base.test.mjs'
      - 'tests/world-native-gridarea-oriented.test.mjs'
      - 'tests/world-native-catalog-core.test.mjs'
      - 'tests/world-native-gridarea-local-window.test.mjs'
      - 'tests/world-native-terrain-preview.test.mjs'
      - 'tests/world-native-gridobject-item-area-link.test.mjs'
      - 'tests/world-native-default-gridlayers-cell.test.mjs'
      - 'tests/world-native-default-gridlayers-window.test.mjs'
      - 'tests/world-native-default-candidate-probe.test.mjs'
      - 'src/lib/world/native-default-candidate-probe.ts'
      - 'src/lib/world/native-default-gridlayers-window.ts'
      - 'src/lib/world/native-default-gridlayers-cell.ts'
      - 'src/lib/world/native-gridobject-item-area-link.ts'
      - 'tests/world-reference-graph.test.mjs'
      - 'tests/world-item-geography.test.mjs'
      - 'tests/world-native-item-scope.test.mjs'
