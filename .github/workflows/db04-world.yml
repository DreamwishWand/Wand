      - 'tests/world-native-tag-taxonomy.test.mjs'
      - 'tests/world-worldless-source-placements.test.mjs'
      - 'tests/world-village-world-tag-overlap.test.mjs'
      - 'tests/world-native-area-tag-overlap.test.mjs'
      - 'tests/world-native-realm-subtree.test.mjs'
      - 'tests/world-native-graph-browser.test.mjs'
      - 'tests/world-native-grid-navigation.test.mjs'
      - '.github/workflows/db04-world.yml'
  workflow_dispatch:

jobs:
  db04:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust World archive verifier
        run: cargo test --manifest-path crates/wand-world-core/Cargo.toml
      - name: Install pinned native disassembler for synthetic CI fixtures
        run: python -m pip install --disable-pip-version-check -r tools/db-04-world/requirements-native-disassembly.txt
      - name: Test native world evidence extraction
        run: python -m unittest discover -s tools/db-04-world -p 'test_*.py' -v
      - name: Validate Windows one-shot PowerShell source syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/db-04-world/run.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Fail closed on invalid private native evidence before extraction
        shell: pwsh
        run: |
          $game = Join-Path $env:RUNNER_TEMP "db04-source-preflight"
          $output = Join-Path $env:RUNNER_TEMP "db04-no-incomplete-output"
          New-Item -ItemType Directory -Path $game -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $game "FullVersion.txt") -Value "1.26.2"
          $bad = Join-Path $game "missing-dump.cs"
          $failed = $false
          try {
            & "./tools/db-04-world/run.ps1" -GameRoot $game -OutputRoot $output -Il2CppDumpPath $bad -Il2CppDumpGameVersion "1.26.2"
          } catch {
            $failed = $true
          }
          if (-not $failed -or (Test-Path -LiteralPath $output)) {
            throw "Invalid IL2CPP capture arguments created an incomplete DB-04 snapshot"
          }
          Set-Content -LiteralPath $bad -Value "// synthetic matching version"
          $mismatchFailed = $false
          try {
            & "./tools/db-04-world/run.ps1" -GameRoot $game -OutputRoot $output -Il2CppDumpPath $bad -Il2CppDumpGameVersion "1.26.1"
          } catch {
            $mismatchFailed = $_.Exception.Message -match "differs"
          }
          if (-not $mismatchFailed -or (Test-Path -LiteralPath $output)) {
            throw "Mismatched Steam/IL2CPP dump version did not stop before extraction"
          }
          $failed = $false
          try {
            & "./tools/db-04-world/run.ps1" -GameRoot $game -OutputRoot $output -Il2CppDumpPath $bad -Il2CppDumpGameVersion "1.26.2"
          } catch {
            $failed = $true
          }
          if (-not $failed -or (Test-Path -LiteralPath $output)) {
            throw "Missing GameAssembly.dll silently triggered metadata-only capture"
          }
      - name: Test browser-facing world catalog
        run: node --experimental-strip-types --test tests/world.test.mjs tests/world-local-snapshot.test.mjs tests/world-source-load-epoch.test.mjs tests/world-preview-views.test.mjs tests/world-native-region-grid-atlas.test.mjs tests/world-native-floor-match.test.mjs tests/world-media-map-calibration.test.mjs tests/world-source-placement-preview.test.mjs tests/world-native-floor-rectangle-window.test.mjs tests/world-saved-source-candidates.test.mjs tests/world-native-version-gate.test.mjs
      - name: Test native source-local anchor envelope under TypeScript
        run: node --experimental-strip-types --test tests/world-native-anchor-domain.test.mjs tests/world-native-source-anchor-index.test.mjs tests/world-native-item-anchor-finder.test.mjs tests/world-native-gridarea-evidence.test.mjs tests/world-native-gridarea-base.test.mjs tests/world-native-gridarea-oriented.test.mjs tests/world-native-catalog-core.test.mjs tests/world-native-gridarea-local-window.test.mjs tests/world-native-oblique.test.mjs tests/world-native-terrain-preview.test.mjs tests/world-native-gridobject-item-area-link.test.mjs tests/world-native-default-gridlayers-cell.test.mjs tests/world-native-default-gridlayers-window.test.mjs tests/world-native-default-candidate-probe.test.mjs tests/world-reference-graph.test.mjs tests/world-item-geography.test.mjs tests/world-native-item-scope.test.mjs tests/world-native-realm-universe.test.mjs tests/world-native-tag-taxonomy.test.mjs tests/world-worldless-source-placements.test.mjs tests/world-village-world-tag-overlap.test.mjs tests/world-native-area-tag-overlap.test.mjs tests/world-native-realm-subtree.test.mjs tests/world-native-graph-browser.test.mjs tests/world-native-grid-navigation.test.mjs
