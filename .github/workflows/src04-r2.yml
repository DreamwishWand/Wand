name: SRC-04 private R2 staging checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Run synthetic tests (no game files or R2 credentials)
        run: python -m unittest discover -s tools/src-04-r2 -p "test_*.py" -v
