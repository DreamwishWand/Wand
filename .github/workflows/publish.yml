name: Publish Wand to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /Wand
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify deployed Collection
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$base/collection/" -o /tmp/wand-collection.html &&
               curl --fail --silent --show-error --location "$base/ddv/collection/v1.25/index.json" -o /tmp/wand-catalog.json; then
              break
            fi
            sleep 3
          done
          grep -q 'Collection' /tmp/wand-collection.html
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/wand-catalog.json","utf8"));if(x.n!==12552||x.shards.length!==18)process.exit(1)'
          for hash in be04cf5698b094a1597bac8ceafa9c43d696c4bf75c8be8db2504ce764b58489 4f1ed414b3f554a69dbc7b4e682507274c58ad327ace7e22808469aa1e56eff4 461f6484256c69e5a528adc3af7054301841fc324c237d8bc0d4534830345bec; do
            shard="${hash:0:2}"
            url="$base/ddv/item-images/steam-1.25.3-schema626-lossless160-v1/$shard/$hash.webp"
            curl --fail --silent --show-error --location --retry 3 --retry-all-errors "$url" -o "/tmp/$hash.webp" -D "/tmp/$hash.headers"
            echo "$hash  /tmp/$hash.webp" | sha256sum -c -
            grep -iq '^content-type: image/webp' "/tmp/$hash.headers"
          done
