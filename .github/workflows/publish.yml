name: Publish Wand to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
        env:
          BASE_PATH: /Wand
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify deployed Collection
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$base/collection/" -o /tmp/wand-collection.html &&
               curl --fail --silent --show-error --location "$base/ddv/collection/v1.25/index.json" -o /tmp/wand-catalog.json; then
              break
            fi
            sleep 3
          done
          grep -q 'Collection' /tmp/wand-collection.html
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/wand-catalog.json","utf8"));if(x.n!==12552||x.shards.length!==18)process.exit(1)'
