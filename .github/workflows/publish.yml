name: Publish Wand to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**/*.md'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'tools/src-04-r2/**'
      - 'tools/src-03-guide/**'
      - 'tools/src-01-items/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('crates/**/Cargo.lock', 'crates/**/Cargo.toml') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-downloads-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-downloads-${{ runner.os }}-
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/wand-collection-core
          output: src/lib/collection/wasm/pkg
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/ddv-save-schema
          output: src/lib/save/wasm/pkg
          features: wasm
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/ddv-p1g-codec
          output: src/lib/save/wasm/p1g-pkg
          features: wasm
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/wand-acquisition-core
          output: src/lib/acquisition/wasm/pkg
          features: wasm
      - uses: ./.github/actions/wand-wasm
        with:
          crate: crates/wand-world-core
          output: src/lib/world/wasm/pkg
      - run: npm install --no-audit --no-fund
      - run: python3 scripts/build-collection-images.py
      - run: python3 tools/photo-mode/prepare_pages_preview.py
      - run: npm run build
        env:
          BASE_PATH: /Wand
      - name: Verify artifact and record deployed commit
        run: python3 tools/ci/pages_receipt.py --build build --commit "$GITHUB_SHA"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Verify deployed commit and representative artifact bytes
        env:
          PAGE_URL: ${{ steps.publish.outputs.page_url }}
        run: python3 tools/ci/pages_receipt.py --url "$PAGE_URL" --commit "$GITHUB_SHA"
