<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12101b" />
    <script>
      // Restore whitelisted theme preference before hydration to avoid flashing.
      // Values are strictly whitelisted; nothing from storage enters markup.
      try {
        const savedTheme=localStorage.getItem('dreamwishwand.ui.theme.v1');
        const theme=['dawn','coral','night'].includes(savedTheme)?savedTheme:
          savedTheme==='light'?'coral':'night';
        document.documentElement.dataset.wandTheme=theme;
        document.documentElement.style.colorScheme=theme==='night'?'dark':'light';
        const savedLang=localStorage.getItem('dreamwishwand.ui.language.v1');
        if(['ja','en','fr','it','de','es-ES','zh-CN','pt-BR'].includes(savedLang)){
          document.documentElement.lang=savedLang;
        }
      }catch{}
    </script>
    <link rel="icon" href="%sveltekit.assets%/DreamwishWand_Large.svg" type="image/svg+xml" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
