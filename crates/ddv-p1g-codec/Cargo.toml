[package]
name = "ddv-p1g-codec"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "DB-05 native synthetic P1G/ZIP interoperability laboratory; no product export"

[features]
default = []
native-p1g-lab = []

[dependencies]
aes = "=0.8.4"
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
serde_json = "=1.0.145"
ddv-save-patch = { path = "../ddv-save-patch" }

[lib]
crate-type = ["rlib"]
