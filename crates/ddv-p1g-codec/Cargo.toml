[package]
name = "ddv-p1g-codec"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "DB-05 native synthetic P1G/ZIP interoperability laboratory; no product export"

[features]
default = []
native-p1g-lab = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
aes = "=0.8.4"
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
ddv-save-patch = { path = "../ddv-save-patch" }
sha2 = "=0.10.8"
zeroize = "=1.8.2"
wasm-bindgen = { version = "0.2", optional = true }

[lib]
crate-type = ["rlib", "cdylib"]

[build-dependencies]
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
serde_json = "=1.0.145"
sha2 = "=0.10.8"
