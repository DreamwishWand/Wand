[package]
name = "ddv-save-patch"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Rust-first byte-preserving existing-quantity JSON draft; NOT a P1G Writer"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde_json = "=1.0.145"
wasm-bindgen = { version = "0.2", optional = true }
