[package]
name = "ddv-save-schema"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Read-only versioned DDV save schema and identity witness; no codec or Writer"

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[lib]
crate-type = ["rlib", "cdylib"]
