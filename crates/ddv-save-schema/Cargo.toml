[package]
name = "ddv-save-schema"
version = "0.1.0"
edition = "2021"
publish = false
license = "UNLICENSED"
description = "Read-only versioned DDV save schema and identity witness; no codec or Writer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
crate-type = ["rlib", "cdylib"]
