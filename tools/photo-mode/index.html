<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private pose diagnostic</title><body><h1>Private pose diagnostic</h1><p>Geometry only; not game pose parity. Local files, no uploads.</p><label>Package directory <input id="files" type="file" webkitdirectory multiple></label><select id="clips" aria-label="Clip" disabled></select><canvas id="canvas" width="400" height="400" style="display:block;max-width:100%"></canvas><button id="play">Play</button><button id="restart">Restart</button><label>Time <input id="seek" type="range" min="0" step="0.001"></label><select id="speed" aria-label="Speed"></select><label><input id="loop" type="checkbox" checked>Loop</label><label>Angle <input id="angle" type="range" min="-3.14159" max="3.14159" step=".01" value="0"></label><label>Zoom <input id="zoom" type="range" min=".5" max="3" step=".05" value="1"></label><output id="status"></output><script type="module" src="preview.js"></script></body></html>
